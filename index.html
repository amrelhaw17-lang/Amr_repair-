<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amr | نظام إدارة الصيانة والمبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo', sans-serif; }
  input, select, textarea, button { font-family: 'Cairo', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid #D98D4A; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  .segmented { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .segmented::-webkit-scrollbar { display: none; }
  .mtr-layout { display: flex; align-items: flex-start; }
  .mtr-sidebar { display: none; }
  .mtr-topnav { display: block; }
  .mtr-content { flex: 1; min-width: 0; }
  @media (min-width: 860px) {
    .mtr-sidebar { display: flex !important; }
    .mtr-topnav { display: none !important; }
  }
  @media print {
    body * { visibility: hidden; }
    .print-overlay, .print-overlay * { visibility: visible; }
    .print-overlay { position: absolute; inset: 0; padding: 24px; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCWrvXhnZRqyfXWd8gUuxOJQBlkigo404g",
    authDomain: "amr-elhaw.firebaseapp.com",
    projectId: "amr-elhaw",
    storageBucket: "amr-elhaw.firebasestorage.app",
    messagingSenderId: "896795152549",
    appId: "1:896795152549:web:50e5b9d7d921557b04bd4c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  function getSecondaryAuth() {
    let secApp;
    try { secApp = firebase.app("Secondary"); } catch (e) { secApp = firebase.initializeApp(firebaseConfig, "Secondary"); }
    return secApp.auth();
  }
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const DEVICE_TYPES = ["لاب توب", "ديسكتوب", "موبايل", "كاميرات مراقبة و NVR", "إكسسوارات وقطع غيار", "أخرى"];
const OS_TYPES = ["أندرويد", "آيفون"];
const ISSUE_TYPES = [
  "سوفت وير / نظام تشغيل", "صيانة بوردة / دوائر إلكترونية", "مشكلة باور / شحن",
  "تغيير شاشة", "تغيير بطارية", "تغيير أو ترقية (هارد / رامات)",
  "تنظيف وتغيير معجون حراري", "تركيب وبرمجة أجهزة", "أخرى",
];
const PART_TYPES = ["قطعة غيار", "إكسسوار"];
const STATUSES = [
  { key: "قيد الإصلاح", color: "#E0A030" },
  { key: "جاهز للاستلام", color: "#33C15A" },
  { key: "بانتظار قطعة غيار", color: "#3B93E0" },
  { key: "تم التسليم", color: "#8B93A0" },
  { key: "ملغي", color: "#E5484D" },
];

const money = (n) => `${(Number(n) || 0).toLocaleString("en-US")} ج.م`;
const statusMeta = (s) => STATUSES.find((x) => x.key === s) || STATUSES[0];
const todayISO = () => new Date().toISOString().slice(0, 10);

function whatsappLink(phone, text) {
  let p = (phone || "").replace(/[^\d]/g, "");
  if (p.startsWith("0")) p = "20" + p.slice(1);
  else if (!p.startsWith("20")) p = "20" + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function qrUrl(data, size = 140) {
  return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(data)}`;
}
function genCode() {
  return "P" + Date.now().toString(36).toUpperCase().slice(-6);
}

function emptyForm(tech) {
  return { customerName: "", phone: "", deviceCategory: DEVICE_TYPES[0], os: OS_TYPES[0], brandModel: "",
    issueType: ISSUE_TYPES[0], technician: tech || "", notes: "", totalCost: "", prepaid: "", expectedDate: "", partsUsed: [] };
}

async function getNextNumber(kind) {
  const ref = db.collection("meta").doc(kind);
  return db.runTransaction(async (t) => {
    const doc = await t.get(ref);
    const next = (doc.exists ? doc.data().value : 0) + 1;
    t.set(ref, { value: next });
    return next;
  });
}

function rangeStart(period) {
  const now = new Date();
  if (period === "day") { const d = new Date(now); d.setHours(0, 0, 0, 0); return d; }
  if (period === "week") { const d = new Date(now); const day = d.getDay(); d.setDate(d.getDate() - day); d.setHours(0, 0, 0, 0); return d; }
  if (period === "month") { return new Date(now.getFullYear(), now.getMonth(), 1); }
  return new Date(0);
}

function AmrLogo({ size = 34 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.24, background: "linear-gradient(135deg, #6C5CE7 0%, #A855F7 45%, #F0A030 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: "0 2px 6px rgba(0,0,0,0.25)" }}>
      <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5L21 21.5H16.8L14.6 16.8H9.4L7.2 21.5H3L12 2.5Z" fill="white" />
        <rect x="9.9" y="12.2" width="4.2" height="2.1" fill="#6C5CE7" />
      </svg>
    </div>
  );
}

  const [theme, setTheme] = useState(localStorage.getItem("mtr-theme") || "dark");
  const [authUser, setAuthUser] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [tickets, setTickets] = useState([]);
  const [parts, setParts] = useState([]);
  const [sales, setSales] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [technicians, setTechnicians] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("dashboard");
  const [form, setForm] = useState(emptyForm());
  const [editingId, setEditingId] = useState(null);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  const [printTicket, setPrintTicket] = useState(null);
  const [toast, setToast] = useState(null);

  const isDark = theme === "dark";
  const styles = useMemo(() => makeStyles(isDark), [isDark]);
  const isAdmin = profile && profile.role === "admin";

  useEffect(() => { localStorage.setItem("mtr-theme", theme); }, [theme]);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setAuthUser(u || null);
      if (u) {
        try {
          const doc = await db.collection("technicians").doc(u.uid).get();
          setProfile(doc.exists ? doc.data() : null);
        } catch (e) { setProfile(null); }
      } else setProfile(null);
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!authUser || !profile) return;
    const u1 = db.collection("tickets").orderBy("number", "desc").onSnapshot((s) => { setTickets(s.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); }, () => setLoading(false));
    const u2 = db.collection("parts").orderBy("name").onSnapshot((s) => setParts(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    const u3 = db.collection("sales").orderBy("date", "desc").onSnapshot((s) => setSales(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    const u3b = db.collection("expenses").orderBy("date", "desc").onSnapshot((s) => setExpenses(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    const u4 = db.collection("technicians").onSnapshot((s) => setTechnicians(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => { u1(); u2(); u3(); u3b(); u4(); };
  }, [authUser, profile]);

  const notify = (text, type = "success") => { setToast({ type, text }); setTimeout(() => setToast(null), 2800); };

  const completeSetup = async (name) => {
    const snap = await db.collection("technicians").limit(1).get();
    const role = snap.empty ? "admin" : "staff";
    const data = { name, email: authUser.email, role, active: true };
    await db.collection("technicians").doc(authUser.uid).set(data);
    setProfile(data);
  };

  const resetForm = () => { setForm(emptyForm(profile && profile.name)); setEditingId(null); };

  const submitTicket = async (e) => {
    e.preventDefault();
    if (!form.customerName.trim() || !form.phone.trim()) { notify("اسم العميل ورقم الهاتف مطلوبين", "error"); return; }
    try {
      if (editingId) {
        await db.collection("tickets").doc(editingId).update({ ...form, updatedBy: profile.name, updatedAt: new Date().toISOString() });
        notify("اتعدل الإيصال بنجاح");
      } else {
        const number = await getNextNumber("ticketCounter");
        await db.collection("tickets").add({ number, date: new Date().toISOString(), status: "قيد الإصلاح", updatedBy: profile.name, ...form });
        for (const p of form.partsUsed) {
          const ref = db.collection("parts").doc(p.partId);
          await db.runTransaction(async (t) => { const d = await t.get(ref); if (d.exists) t.update(ref, { quantity: Math.max(0, (d.data().quantity || 0) - p.qty) }); });
        }
        notify(`اتضاف إيصال رقم AMR-${String(number).padStart(4, "0")}`);
      }
      resetForm(); setTab("dashboard");
    } catch (err) { console.error(err); notify("حصل خطأ في الحفظ", "error"); }
  };

  const startEdit = (t) => {
    setForm({ customerName: t.customerName, phone: t.phone, deviceCategory: t.deviceCategory, os: t.os, brandModel: t.brandModel,
      issueType: t.issueType, technician: t.technician, notes: t.notes || "", totalCost: t.totalCost, prepaid: t.prepaid,
      expectedDate: t.expectedDate, partsUsed: t.partsUsed || [] });
    setEditingId(t.id); setTab("form");
  };

  const changeStatus = async (t, status) => {
    await db.collection("tickets").doc(t.id).update({ status, updatedBy: profile.name, updatedAt: new Date().toISOString() });
    if (status === "جاهز للاستلام" && t.phone) {
      const due = (Number(t.totalCost) || 0) - (Number(t.prepaid) || 0);
      const msg = `أهلاً ${t.customerName}، جهازك (${t.brandModel || t.deviceCategory}) بقى جاهز للاستلام من Amr.\nرقم الإيصال: AMR-${String(t.number).padStart(4, "0")}\nالمتبقي: ${money(due)}`;
      window.open(whatsappLink(t.phone, msg), "_blank");
    }
  };

  const deleteTicket = async (id) => { if (!confirm("متأكد إنك عايز تمسح الإيصال ده؟")) return; await db.collection("tickets").doc(id).delete(); notify("اتمسح الإيصال", "error"); };

  const stats = useMemo(() => {
    const active = tickets.filter((t) => t.status !== "ملغي");
    const open = tickets.filter((t) => t.status !== "تم التسليم" && t.status !== "ملغي");
    const closed = tickets.filter((t) => t.status === "تم التسليم");
    const liquidity = open.reduce((s, t) => s + (Number(t.prepaid) || 0), 0);
    const dues = active.reduce((s, t) => s + Math.max(0, (Number(t.totalCost) || 0) - (Number(t.prepaid) || 0)), 0);
    const closedRevenue = closed.reduce((s, t) => s + (Number(t.totalCost) || 0), 0);
    return { liquidity, dues, closedRevenue, openCount: open.length, closedCount: closed.length };
  }, [tickets]);

  const exportExcel = () => {
    const rows = tickets.map((t) => ({
      "رقم الإيصال": `AMR-${String(t.number).padStart(4, "0")}`, "التاريخ": new Date(t.date).toLocaleDateString("ar-EG"),
      "العميل": t.customerName, "الهاتف": t.phone, "الجهاز": t.deviceCategory, "الموديل": t.brandModel,
      "العطل": t.issueType, "الفني": t.technician, "الإجمالي": t.totalCost, "المدفوع": t.prepaid,
      "المتبقي": (Number(t.totalCost) || 0) - (Number(t.prepaid) || 0), "الحالة": t.status,
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "الإيصالات");
    XLSX.writeFile(wb, `Amr-${todayISO()}.xlsx`);
  };

  const exportBackup = () => {
    const data = { tickets, parts, sales, expenses, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Amr-backup-${todayISO()}.json`; a.click();
  };

  const importBackup = async (file) => {
    if (!confirm("استيراد النسخة الاحتياطية هيضيف البيانات دي فوق الموجود. متأكد؟")) return;
    try {
      const data = JSON.parse(await file.text());
      const batch = db.batch();
      (data.tickets || []).forEach((t) => { const { id, ...r } = t; batch.set(db.collection("tickets").doc(id), r); });
      (data.parts || []).forEach((p) => { const { id, ...r } = p; batch.set(db.collection("parts").doc(id), r); });
      (data.sales || []).forEach((s) => { const { id, ...r } = s; batch.set(db.collection("sales").doc(id), r); });
      (data.expenses || []).forEach((e) => { const { id, ...r } = e; batch.set(db.collection("expenses").doc(id), r); });
      await batch.commit();
      notify("تم استيراد النسخة الاحتياطية");
    } catch (err) { console.error(err); notify("فشل الاستيراد، تأكد من الملف", "error"); }
  };

  if (authUser === undefined) return <div style={{ minHeight: "100vh", background: styles.C.bg }} />;
  if (!authUser) return <Login styles={styles} />;
  if (!profile) return <SetupName styles={styles} email={authUser.email} onSave={completeSetup} />;
  if (profile.active === false) return <BlockedScreen styles={styles} onLogout={() => auth.signOut()} />;

  const TABS = [
    { key: "dashboard", label: "الرئيسية", icon: "🏠", color: "#0A84FF" },
    { key: "form", label: "إيصال جديد", icon: "➕", color: "#34C759" },
    { key: "sales", label: "نقطة بيع", icon: "🛒", color: "#FF9500" },
    { key: "parts", label: "المخزون", icon: "📦", color: "#AF52DE" },
    { key: "customers", label: "العملاء", icon: "👤", color: "#FF375F" },
    ...(isAdmin ? [
      { key: "expenses", label: "المصروفات", icon: "🧾", color: "#FF3B30" },
      { key: "accounts", label: "الحسابات", icon: "💰", color: "#30B0C7" },
      { key: "users", label: "المستخدمين", icon: "👥", color: "#5E5CE6" },
    ] : []),
  ];

  return (
    <div style={styles.app}>
      {printTicket && <PrintView ticket={printTicket} onClose={() => setPrintTicket(null)} />}
      <div style={{ ...styles.header, position: "relative" }}>
        <div style={styles.trafficLights}>
          <span style={{ ...styles.dot, background: "#FF5F57" }} /><span style={{ ...styles.dot, background: "#FEBC2E" }} /><span style={{ ...styles.dot, background: "#28C840" }} />
        </div>
        <div style={styles.headerInner}>
          <div style={styles.brandRow}>
            <AmrLogo />
            <div><div style={styles.brandTitle}>Amr</div><div style={styles.brandSub}>{isAdmin ? "أدمن" : "فني"} · {profile.name}</div></div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ ...styles.macToggle, background: isDark ? "#0A84FF" : "#D0D0D5" }} onClick={() => setTheme(isDark ? "light" : "dark")}>
              <div style={{ ...styles.macToggleKnob, left: isDark ? 22 : 2 }} />
            </div>
            <button style={styles.userChip} onClick={() => auth.signOut()}>خروج</button>
          </div>
        </div>
      </div>

      <div className="mtr-layout" style={styles.layout}>
        <div className="mtr-sidebar" style={styles.sidebar}>
          {TABS.map((t) => (
            <button key={t.key} onClick={() => { if (t.key === "form") resetForm(); setTab(t.key); }} style={{ ...styles.sideBtn, ...(tab === t.key ? styles.sideBtnActive : {}) }}>
              <span style={{ ...styles.sideIcon, background: t.color }}>{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </div>

        <div className="mtr-content">
          <div className="mtr-topnav segmented" style={styles.nav}>
            {TABS.map((t) => (
              <button key={t.key} onClick={() => { if (t.key === "form") resetForm(); setTab(t.key); }} style={{ ...styles.navBtn, ...(tab === t.key ? { ...styles.navBtnActive, background: t.color, borderColor: t.color } : {}) }}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>

          <main style={styles.main}>
            {loading ? <div style={styles.dim}>جاري التحميل...</div> : tab === "dashboard" ? (
              <Dashboard styles={styles} stats={stats} tickets={tickets} parts={parts} query={query} setQuery={setQuery} statusFilter={statusFilter} setStatusFilter={setStatusFilter}
                onEdit={startEdit} onDelete={deleteTicket} onStatus={changeStatus} onPrint={setPrintTicket}
                onExportExcel={exportExcel} onExportBackup={exportBackup} onImportBackup={importBackup} isAdmin={isAdmin} />
            ) : tab === "form" ? (
              <TicketForm styles={styles} form={form} setForm={setForm} onSubmit={submitTicket} editing={!!editingId} onCancel={() => { resetForm(); setTab("dashboard"); }} parts={parts} />
            ) : tab === "sales" ? (
              <SalesPOS styles={styles} parts={parts} sales={sales} profile={profile} notify={notify} isAdmin={isAdmin} />
            ) : tab === "parts" ? (
              <PartsInventory styles={styles} parts={parts} notify={notify} isAdmin={isAdmin} />
            ) : tab === "customers" ? (
              <Customers styles={styles} tickets={tickets} />
            ) : tab === "expenses" ? (
              <Expenses styles={styles} expenses={expenses} profile={profile} notify={notify} />
            ) : tab === "accounts" ? (
              <Accounts styles={styles} tickets={tickets} sales={sales} expenses={expenses} />
            ) : (
              <UsersManagement styles={styles} technicians={technicians} notify={notify} />
            )}
          </main>
        </div>
      </div>
      {toast && <div style={{ ...styles.toast, borderColor: toast.type === "error" ? "#E5484D" : "#33C15A" }}>{toast.text}</div>}
    </div>
  );
}

function Login({ styles }) {
  const [email, setEmail] = useState(""); const [password, setPassword] = useState(""); const [error, setError] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    try { await auth.signInWithEmailAndPassword(email.trim(), password); }
    catch (err) {
      const map = { "auth/invalid-email": "الإيميل مش صحيح", "auth/user-not-found": "الحساب مش موجود", "auth/wrong-password": "الباسورد غلط", "auth/invalid-credential": "بيانات الدخول غلط", "auth/too-many-requests": "محاولات كتير، جرب بعد شوية" };
      setError(map[err.code] || "حصل خطأ");
    }
    setBusy(false);
  };
  return (
    <div style={styles.loginWrap}>
      <form onSubmit={submit} style={styles.loginCard}>
        <div style={styles.brandRow}><AmrLogo /><div><div style={styles.brandTitle}>Amr</div><div style={styles.brandSub}>نظام إدارة الصيانة والمبيعات</div></div></div>
        <div style={{ ...styles.fieldLabel, margin: "20px 0 10px" }}>تسجيل الدخول</div>
        <input style={{ ...styles.input, marginBottom: 10 }} type="email" placeholder="الإيميل" value={email} onChange={(e) => setEmail(e.target.value)} required />
        <input style={{ ...styles.input, marginBottom: 10 }} type="password" placeholder="الباسورد" value={password} onChange={(e) => setPassword(e.target.value)} required />
        {error && <div style={{ color: "#E5484D", fontSize: 13, marginBottom: 10 }}>{error}</div>}
        <button type="submit" style={styles.primaryBtn} disabled={busy}>{busy ? "جاري الدخول..." : "دخول"}</button>
      </form>
    </div>
  );
}

function SetupName({ styles, onSave, email }) {
  const [name, setName] = useState("");
  return (
    <div style={styles.loginWrap}>
      <div style={styles.loginCard}>
        <div style={styles.fieldLabel}>أهلاً! ({email})</div>
        <div style={{ ...styles.dim, margin: "8px 0 14px" }}>اكتب اسمك عشان يظهر في الإيصالات</div>
        <input style={{ ...styles.input, marginBottom: 10 }} placeholder="اسمك" value={name} onChange={(e) => setName(e.target.value)} />
        <button style={styles.primaryBtn} onClick={() => name.trim() && onSave(name.trim())}>حفظ ومتابعة</button>
      </div>
    </div>
  );
}

function BlockedScreen({ styles, onLogout }) {
  return (
    <div style={styles.loginWrap}>
      <div style={styles.loginCard}>
        <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 8 }}>الحساب متوقف</div>
        <div style={styles.dim}>الأدمن أوقف الحساب ده. كلم عمرو لو في مشكلة.</div>
        <button style={{ ...styles.ghostBtn, marginTop: 16 }} onClick={onLogout}>خروج</button>
      </div>
    </div>
  );
}

function StatCard({ styles, label, value, accent }) {
  return <div style={{ ...styles.statCard, borderTopColor: accent }}><div style={styles.statLabel}>{label}</div><div style={{ ...styles.statValue, color: accent }}>{value}</div></div>;
}

function Dashboard({ styles, stats, tickets, parts, query, setQuery, statusFilter, setStatusFilter, onEdit, onDelete, onStatus, onPrint, onExportExcel, onExportBackup, onImportBackup, isAdmin }) {
  const fileRef = useRef();
  const filtered = useMemo(() => tickets.filter((t) => {
    const mq = !query || t.customerName.includes(query) || t.phone.includes(query) || (t.brandModel || "").includes(query) || String(t.number).includes(query);
    const ms = statusFilter === "الكل" || t.status === statusFilter;
    return mq && ms;
  }), [tickets, query, statusFilter]);

  const dueSoon = useMemo(() => {
    const today = todayISO();
    return tickets.filter((t) => t.expectedDate && t.expectedDate <= today && t.status !== "تم التسليم" && t.status !== "ملغي");
  }, [tickets]);

  const lowStock = useMemo(() => (parts || []).filter((p) => p.quantity <= 2), [parts]);

  return (
    <div>
      {dueSoon.length > 0 && (
        <div style={{ ...styles.alertBanner, borderColor: "#E0A030" }}>
          <span>⏰ في {dueSoon.length} إيصال ميعاد تسليمه وصل أو فات ولسه مش متسلّم</span>
          <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 4 }}>
            {dueSoon.slice(0, 4).map((t) => <span key={t.id} style={{ fontSize: 12.5 }}>AMR-{String(t.number).padStart(4, "0")} — {t.customerName} ({t.expectedDate})</span>)}
          </div>
        </div>
      )}
      {isAdmin && lowStock.length > 0 && (
        <div style={{ ...styles.alertBanner, borderColor: "#E5484D" }}>
          <span>📦 {lowStock.length} صنف قارب على النفاذ في المخزون</span>
          <div style={{ marginTop: 6, display: "flex", flexWrap: "wrap", gap: 6 }}>
            {lowStock.map((p) => <span key={p.id} style={styles.tagPill}>{p.name} ({p.quantity})</span>)}
          </div>
        </div>
      )}
      <div style={styles.statsRow}>
        <StatCard styles={styles} label="السيولة الحالية" value={money(stats.liquidity)} accent="#33C15A" />
        <StatCard styles={styles} label="المستحقات لدى العملاء" value={money(stats.dues)} accent="#E0A030" />
        <StatCard styles={styles} label="إيرادات مُسلَّمة" value={money(stats.closedRevenue)} accent="#3B93E0" />
      </div>
      {isAdmin && (
        <div style={styles.toolsRow}>
          <button style={styles.ghostBtnSm} onClick={onExportExcel}>📥 تصدير إكسل</button>
          <button style={styles.ghostBtnSm} onClick={onExportBackup}>💾 نسخة احتياطية</button>
          <button style={styles.ghostBtnSm} onClick={() => fileRef.current.click()}>📂 استيراد نسخة</button>
          <input ref={fileRef} type="file" accept=".json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && onImportBackup(e.target.files[0])} />
        </div>
      )}
      <div style={styles.filterRow}>
        <div style={styles.searchBox}><input style={styles.searchInput} placeholder="دور برقم الإيصال، العميل، الموبايل، أو الموديل..." value={query} onChange={(e) => setQuery(e.target.value)} /></div>
        <select style={styles.select} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}><option>الكل</option>{STATUSES.map((s) => <option key={s.key}>{s.key}</option>)}</select>
      </div>
      {filtered.length === 0 ? <div style={styles.emptyState}>مفيش إيصالات لسه.</div> : (
        <div style={styles.tableWrap}>{filtered.map((t) => <TicketRow key={t.id} styles={styles} t={t} onEdit={onEdit} onDelete={onDelete} onStatus={onStatus} onPrint={onPrint} isAdmin={isAdmin} />)}</div>
      )}
    </div>
  );
}

function Customers({ styles, tickets }) {
  const [search, setSearch] = useState("");
  const [openPhone, setOpenPhone] = useState(null);

  const customers = useMemo(() => {
    const map = {};
    tickets.forEach((t) => {
      const key = t.phone || "بدون رقم";
      if (!map[key]) map[key] = { phone: t.phone, name: t.customerName, tickets: [], totalSpent: 0 };
      map[key].tickets.push(t);
      map[key].name = t.customerName;
      if (t.status === "تم التسليم") map[key].totalSpent += Number(t.totalCost) || 0;
    });
    return Object.values(map).sort((a, b) => b.tickets.length - a.tickets.length);
  }, [tickets]);

  const filtered = customers.filter((c) => !search || c.name.includes(search) || (c.phone || "").includes(search));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={styles.searchBox}><input style={styles.searchInput} placeholder="دور باسم العميل أو رقم الموبايل..." value={search} onChange={(e) => setSearch(e.target.value)} /></div>
      {filtered.length === 0 ? <div style={styles.emptyState}>مفيش عملاء لسه.</div> : (
        <div style={styles.tableWrap}>
          {filtered.map((c) => (
            <div key={c.phone} style={styles.ticketRow}>
              <div style={styles.rowTop} onClick={() => setOpenPhone(openPhone === c.phone ? null : c.phone)}>
                <div style={styles.rowLeft}><span style={styles.customerName}>{c.name}</span><span style={styles.dim}>· {c.phone}</span></div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={styles.tagPillMono}>{c.tickets.length} إيصال</span>
                  <span style={{ color: "#33C15A", fontWeight: 700 }}>{money(c.totalSpent)}</span>
                  <a href={whatsappLink(c.phone, `أهلاً ${c.name}`)} target="_blank" rel="noreferrer" style={styles.iconBtn} onClick={(e) => e.stopPropagation()}>💬</a>
                </div>
              </div>
              {openPhone === c.phone && (
                <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                  {c.tickets.map((t) => (
                    <div key={t.id} style={styles.partRow}>
                      <span>AMR-{String(t.number).padStart(4, "0")} · {t.deviceCategory} {t.brandModel}</span>
                      <span style={{ color: statusMeta(t.status).color }}>{t.status}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const meta = statusMeta(t.status);
  const due = (Number(t.totalCost) || 0) - (Number(t.prepaid) || 0);
  return (
    <div style={styles.ticketRow}>
      <div style={styles.rowTop}>
        <div style={styles.rowLeft}>
          <span style={{ ...styles.ledDot, background: meta.color }} />
          <span style={styles.receiptTag}>AMR-{String(t.number).padStart(4, "0")}</span>
          <span style={styles.customerName}>{t.customerName}</span>
          <span style={styles.dim}>· {t.phone}</span>
        </div>
        <div style={styles.rowActions}>
          <a href={whatsappLink(t.phone, `أهلاً ${t.customerName}، بخصوص جهازك رقم AMR-${String(t.number).padStart(4, "0")}`)} target="_blank" rel="noreferrer" style={styles.iconBtn} title="واتساب">💬</a>
          <button style={styles.iconBtn} title="طباعة" onClick={() => onPrint(t)}>🖨️</button>
          <button style={styles.iconBtn} title="تعديل" onClick={() => onEdit(t)}>✏️</button>
          {isAdmin && <button style={{ ...styles.iconBtn, color: "#E5484D" }} title="حذف" onClick={() => onDelete(t.id)}>🗑️</button>}
        </div>
      </div>
      <div style={styles.rowMid}>
        <span style={styles.tagPill}>{t.deviceCategory}</span>
        {t.brandModel && <span style={styles.tagPill}>{t.brandModel}</span>}
        <span style={styles.tagPill}>{t.issueType}</span>
        <span style={styles.tagPillMono}>{t.technician}</span>
      </div>
      <div style={styles.rowBottom}>
        <div style={styles.financeRow}>
          <span>الإجمالي: <b>{money(t.totalCost)}</b></span><span>مقدم: <b style={{ color: "#33C15A" }}>{money(t.prepaid)}</b></span><span>متبقي: <b style={{ color: due > 0 ? "#E0A030" : styles.C.dim }}>{money(due)}</b></span>
        </div>
        <select style={{ ...styles.statusSelect, color: meta.color, borderColor: meta.color }} value={t.status} onChange={(e) => onStatus(t, e.target.value)}>
          {STATUSES.map((s) => <option key={s.key} value={s.key}>{s.key}</option>)}
        </select>
      </div>
    </div>
  );
}

function Field({ styles, label, children }) { return <label style={styles.field}><span style={styles.fieldLabel}>{label}</span>{children}</label>; }

function TicketForm({ styles, form, setForm, onSubmit, editing, onCancel, parts }) {
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const [partId, setPartId] = useState(""); const [qty, setQty] = useState(1);
  const addPart = () => {
    const p = parts.find((x) => x.id === partId); if (!p) return;
    setForm({ ...form, partsUsed: [...form.partsUsed, { partId: p.id, name: p.name, price: p.sellPrice, costPrice: p.costPrice, qty: Number(qty) }] });
    setPartId(""); setQty(1);
  };
  const removePart = (i) => setForm({ ...form, partsUsed: form.partsUsed.filter((_, idx) => idx !== i) });
  const partsTotal = form.partsUsed.reduce((s, p) => s + p.price * p.qty, 0);
  const onScan = (code) => {
    const p = parts.find((x) => x.code === code);
    if (!p) return;
    setForm({ ...form, partsUsed: [...form.partsUsed, { partId: p.id, name: p.name, price: p.sellPrice, costPrice: p.costPrice, qty: 1 }] });
  };

  return (
    <form onSubmit={onSubmit} style={styles.formCard}>
      <div style={styles.formTitle}>{editing ? "تعديل الإيصال" : "إضافة إيصال جديد"}</div>
      <div style={styles.formGrid}>
        <Field styles={styles} label="اسم العميل *"><input style={styles.input} value={form.customerName} onChange={set("customerName")} required /></Field>
        <Field styles={styles} label="رقم الهاتف *"><input style={styles.input} value={form.phone} onChange={set("phone")} required /></Field>
        <Field styles={styles} label="تصنيف الجهاز *"><select style={styles.input} value={form.deviceCategory} onChange={set("deviceCategory")}>{DEVICE_TYPES.map((d) => <option key={d}>{d}</option>)}</select></Field>
        {form.deviceCategory === "موبايل" && <Field styles={styles} label="نظام التشغيل"><select style={styles.input} value={form.os} onChange={set("os")}>{OS_TYPES.map((o) => <option key={o}>{o}</option>)}</select></Field>}
        <Field styles={styles} label="الماركة والموديل"><input style={styles.input} value={form.brandModel} onChange={set("brandModel")} /></Field>
        <Field styles={styles} label="العطل الرئيسي *"><select style={styles.input} value={form.issueType} onChange={set("issueType")}>{ISSUE_TYPES.map((i) => <option key={i}>{i}</option>)}</select></Field>
        <Field styles={styles} label="المسؤول / الفني *"><input style={styles.input} value={form.technician} onChange={set("technician")} required /></Field>
        <Field styles={styles} label="تاريخ التسليم المتوقع"><input type="date" style={styles.input} value={form.expectedDate} onChange={set("expectedDate")} /></Field>
        <Field styles={styles} label="التكلفة الإجمالية"><input type="number" min="0" style={styles.input} value={form.totalCost} onChange={set("totalCost")} /></Field>
        <Field styles={styles} label="المدفوع مقدماً"><input type="number" min="0" style={styles.input} value={form.prepaid} onChange={set("prepaid")} /></Field>
        <div style={{ gridColumn: "1 / -1" }}><Field styles={styles} label="ملاحظات"><textarea style={{ ...styles.input, minHeight: 80, resize: "vertical" }} value={form.notes} onChange={set("notes")} /></Field></div>
        <div style={{ gridColumn: "1 / -1" }}>
          <div style={styles.fieldLabel}>قطع الغيار / الإكسسوارات المستخدمة</div>
          <div style={{ margin: "6px 0" }}><ScanInput styles={styles} onScan={onScan} /></div>
          <div style={{ display: "flex", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
            <select style={{ ...styles.input, flex: 1, minWidth: 160 }} value={partId} onChange={(e) => setPartId(e.target.value)}>
              <option value="">اختار...</option>
              {parts.map((p) => <option key={p.id} value={p.id}>{p.name} ({p.quantity} متاح - {money(p.sellPrice)})</option>)}
            </select>
            <input type="number" min="1" style={{ ...styles.input, width: 70 }} value={qty} onChange={(e) => setQty(e.target.value)} />
            <button type="button" style={styles.ghostBtnSm} onClick={addPart}>إضافة</button>
          </div>
          {form.partsUsed.length > 0 && (
            <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
              {form.partsUsed.map((p, i) => <div key={i} style={styles.partRow}><span>{p.name} × {p.qty}</span><span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{money(p.price * p.qty)}</span><button type="button" style={styles.iconBtn} onClick={() => removePart(i)}>✕</button></div>)}
              <div style={{ ...styles.dim, textAlign: "left" }}>إجمالي القطع: <b style={{ color: "#E0A030" }}>{money(partsTotal)}</b></div>
            </div>
          )}
        </div>
      </div>
      <div style={styles.formActions}><button type="submit" style={styles.primaryBtn}>{editing ? "حفظ التعديلات" : "حفظ وإصدار الإيصال"}</button><button type="button" style={styles.ghostBtn} onClick={onCancel}>إلغاء</button></div>
    </form>
  );
}

function SalesPOS({ styles, parts, sales, profile, notify, isAdmin }) {
  const [cart, setCart] = useState([]);
  const [partId, setPartId] = useState(""); const [qty, setQty] = useState(1);
  const addToCart = () => {
    const p = parts.find((x) => x.id === partId); if (!p) return;
    setCart([...cart, { partId: p.id, name: p.name, qty: Number(qty), sellPrice: p.sellPrice, costPrice: p.costPrice }]);
    setPartId(""); setQty(1);
  };
  const removeFromCart = (i) => setCart(cart.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, c) => s + c.sellPrice * c.qty, 0);

  const onScan = (code) => {
    const p = parts.find((x) => x.code === code);
    if (!p) { notify("مفيش صنف بالكود ده", "error"); return; }
    const idx = cart.findIndex((c) => c.partId === p.id);
    if (idx >= 0) { const next = [...cart]; next[idx] = { ...next[idx], qty: next[idx].qty + 1 }; setCart(next); }
    else setCart([...cart, { partId: p.id, name: p.name, qty: 1, sellPrice: p.sellPrice, costPrice: p.costPrice }]);
    notify(`اتضاف: ${p.name}`);
  };

  const checkout = async () => {
    if (cart.length === 0) return;
    try {
      await db.collection("sales").add({ date: new Date().toISOString(), items: cart, total, soldBy: profile.name });
      for (const c of cart) {
        const ref = db.collection("parts").doc(c.partId);
        await db.runTransaction(async (t) => { const d = await t.get(ref); if (d.exists) t.update(ref, { quantity: Math.max(0, (d.data().quantity || 0) - c.qty) }); });
      }
      notify(`تم تسجيل عملية بيع بقيمة ${money(total)}`);
      setCart([]);
    } catch (err) { console.error(err); notify("حصل خطأ في تسجيل البيع", "error"); }
  };

  const todaySales = sales.filter((s) => s.date.slice(0, 10) === todayISO());

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={styles.formCard}>
        <div style={styles.formTitle}>نقطة بيع سريعة</div>
        <div style={{ marginBottom: 10 }}><ScanInput styles={styles} onScan={onScan} /></div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select style={{ ...styles.input, flex: 1, minWidth: 160 }} value={partId} onChange={(e) => setPartId(e.target.value)}>
            <option value="">اختار قطعة / إكسسوار...</option>
            {parts.map((p) => <option key={p.id} value={p.id}>{p.name} ({p.quantity} متاح - {money(p.sellPrice)})</option>)}
          </select>
          <input type="number" min="1" style={{ ...styles.input, width: 70 }} value={qty} onChange={(e) => setQty(e.target.value)} />
          <button type="button" style={styles.ghostBtnSm} onClick={addToCart}>إضافة</button>
        </div>
        {cart.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 6 }}>
            {cart.map((c, i) => <div key={i} style={styles.partRow}><span>{c.name} × {c.qty}</span><span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{money(c.sellPrice * c.qty)}</span><button style={styles.iconBtn} onClick={() => removeFromCart(i)}>✕</button></div>)}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
              <b>الإجمالي: {money(total)}</b>
              <button style={styles.primaryBtn} onClick={checkout}>إتمام البيع</button>
            </div>
          </div>
        )}
      </div>
      <div style={styles.reportCard}>
        <div style={styles.reportTitle}>مبيعات النهاردة ({todaySales.length})</div>
        {todaySales.length === 0 ? <div style={styles.dim}>مفيش مبيعات لسه النهاردة</div> : todaySales.map((s) => (
          <div key={s.id} style={styles.techRow}>
            <span>{s.items.map((i) => `${i.name}×${i.qty}`).join(" + ")}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#33C15A" }}>{money(s.total)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ScanInput({ styles, onScan, placeholder }) {
  const [val, setVal] = useState("");
  return (
    <input
      style={styles.input}
      placeholder={placeholder || "📷 امسح الباركود هنا أو اكتب الكود..."}
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onKeyDown={(e) => { if (e.key === "Enter" && val.trim()) { onScan(val.trim()); setVal(""); } }}
    />
  );
}

function PartLabelPrint({ part, onClose }) {
  useEffect(() => { const t = setTimeout(() => window.print(), 200); return () => clearTimeout(t); }, []);
  return (
    <div className="print-overlay" style={{ position: "fixed", inset: 0, background: "#fff", color: "#111", zIndex: 999, overflow: "auto", padding: 32 }}>
      <button className="no-print" onClick={onClose} style={{ position: "absolute", top: 16, left: 16, padding: "8px 14px", borderRadius: 8, border: "1px solid #ccc", background: "#f2f2f2", cursor: "pointer" }}>إغلاق</button>
      <div style={{ maxWidth: 260, margin: "0 auto", border: "1.5px solid #333", borderRadius: 8, padding: 14, textAlign: "center" }}>
        <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>{part.name}</div>
        <img src={qrUrl(part.code, 130)} alt="QR" style={{ width: 130, height: 130, margin: "0 auto" }} />
        <div style={{ fontFamily: "monospace", fontSize: 12, marginTop: 6 }}>{part.code}</div>
        <div style={{ fontWeight: 700, fontSize: 13, marginTop: 4 }}>{money(part.sellPrice)}</div>
      </div>
    </div>
  );
}

function PartsInventory({ styles, parts, notify, isAdmin }) {
  const [form, setForm] = useState({ name: "", code: "", type: PART_TYPES[0], costPrice: "", sellPrice: "", quantity: "" });
  const [editingId, setEditingId] = useState(null);
  const [typeFilter, setTypeFilter] = useState("الكل");
  const [search, setSearch] = useState("");
  const [labelPart, setLabelPart] = useState(null);

  const submit = async (e) => {
    e.preventDefault(); if (!form.name.trim()) return;
    const payload = { name: form.name, code: form.code.trim() || genCode(), type: form.type, costPrice: Number(form.costPrice) || 0, sellPrice: Number(form.sellPrice) || 0, quantity: Number(form.quantity) || 0 };
    try {
      if (editingId) { await db.collection("parts").doc(editingId).update(payload); notify("اتعدلت"); }
      else { await db.collection("parts").add(payload); notify("اتضافت للمخزون"); }
      setForm({ name: "", code: "", type: PART_TYPES[0], costPrice: "", sellPrice: "", quantity: "" }); setEditingId(null);
    } catch (err) { notify("حصل خطأ", "error"); }
  };
  const edit = (p) => { setForm({ name: p.name, code: p.code || "", type: p.type || PART_TYPES[0], costPrice: p.costPrice, sellPrice: p.sellPrice, quantity: p.quantity }); setEditingId(p.id); };
  const del = async (id) => { if (confirm("تمسح القطعة دي؟")) await db.collection("parts").doc(id).delete(); };
  const onScan = (code) => {
    const p = parts.find((x) => x.code === code);
    if (p) { setSearch(p.name); notify(`لقيت: ${p.name} (متاح ${p.quantity})`); }
    else notify("مفيش صنف بالكود ده", "error");
  };
  const filtered = parts.filter((p) => (typeFilter === "الكل" || p.type === typeFilter) && (!search || p.name.includes(search) || (p.code || "").includes(search)));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {labelPart && <PartLabelPrint part={labelPart} onClose={() => setLabelPart(null)} />}
      {isAdmin && (
        <form onSubmit={submit} style={styles.formCard}>
          <div style={styles.formTitle}>{editingId ? "تعديل" : "إضافة قطعة / إكسسوار"}</div>
          <div style={styles.formGrid}>
            <Field styles={styles} label="الاسم *"><input style={styles.input} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required /></Field>
            <Field styles={styles} label="الكود / الباركود (فاضي = يتولّد تلقائي)"><input style={styles.input} value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} placeholder="امسحه بالسكانر أو اكتبه" /></Field>
            <Field styles={styles} label="النوع"><select style={styles.input} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{PART_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
            <Field styles={styles} label="سعر الشراء (تكلفة)"><input type="number" min="0" style={styles.input} value={form.costPrice} onChange={(e) => setForm({ ...form, costPrice: e.target.value })} /></Field>
            <Field styles={styles} label="سعر البيع"><input type="number" min="0" style={styles.input} value={form.sellPrice} onChange={(e) => setForm({ ...form, sellPrice: e.target.value })} /></Field>
            <Field styles={styles} label="الكمية"><input type="number" min="0" style={styles.input} value={form.quantity} onChange={(e) => setForm({ ...form, quantity: e.target.value })} /></Field>
          </div>
          <div style={styles.formActions}><button type="submit" style={styles.primaryBtn}>{editingId ? "حفظ" : "إضافة"}</button>{editingId && <button type="button" style={styles.ghostBtn} onClick={() => { setForm({ name: "", code: "", type: PART_TYPES[0], costPrice: "", sellPrice: "", quantity: "" }); setEditingId(null); }}>إلغاء</button>}</div>
        </form>

const EXPENSE_CATEGORIES = ["إيجار", "كهرباء ومياه", "رواتب", "صيانة وأدوات", "نقل ومواصلات", "أخرى"];

function Expenses({ styles, expenses, profile, notify }) {
  const [form, setForm] = useState({ category: EXPENSE_CATEGORIES[0], amount: "", note: "" });
  const submit = async (e) => {
    e.preventDefault(); if (!form.amount) return;
    try {
      await db.collection("expenses").add({ date: new Date().toISOString(), category: form.category, amount: Number(form.amount) || 0, note: form.note, addedBy: profile.name });
      notify("اتسجل المصروف"); setForm({ category: EXPENSE_CATEGORIES[0], amount: "", note: "" });
    } catch (err) { notify("حصل خطأ", "error"); }
  };
  const del = async (id) => { if (confirm("تمسح المصروف ده؟")) await db.collection("expenses").doc(id).delete(); };
  const total = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <form onSubmit={submit} style={styles.formCard}>
        <div style={styles.formTitle}>تسجيل مصروف</div>

          <Field styles={styles} label="البند"><select style={styles.input} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{EXPENSE_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</select></Field>
          <Field styles={styles} label="المبلغ *"><input type="number" min="0" style={styles.input} value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} required /></Field>
          <Field styles={styles} label="ملاحظة"><input style={styles.input} value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
        </div>
        <div style={styles.formActions}><button type="submit" style={styles.primaryBtn}>تسجيل</button></div>
      </form>
      <StatCard styles={styles} label="إجمالي كل المصروفات المسجلة" value={money(total)} accent="#E5484D" />
      {expenses.length === 0 ? <div style={styles.emptyState}>مفيش مصروفات مسجلة لسه.</div> : (
        <div style={styles.tableWrap}>
          {expenses.map((e) => (
            <div key={e.id} style={styles.ticketRow}>
              <div style={styles.rowTop}>

          ))}
        </div>
      )}
    </div>
  );
}

function Accounts({ styles, tickets, sales, expenses }) {
  const [period, setPeriod] = useState("day");
  const start = rangeStart(period);

  const closedInRange = tickets.filter((t) => t.status === "تم التسليم" && new Date(t.updatedAt || t.date) >= start);
  const salesInRange = sales.filter((s) => new Date(s.date) >= start);
  const expensesInRange = expenses.filter((e) => new Date(e.date) >= start);

  const ticketRevenue = closedInRange.reduce((s, t) => s + (Number(t.totalCost) || 0), 0);
  const ticketCOGS = closedInRange.reduce((s, t) => s + (t.partsUsed || []).reduce((a, p) => a + (p.costPrice || 0) * p.qty, 0), 0);
  const salesRevenue = salesInRange.reduce((s, x) => s + x.total, 0);
  const salesCOGS = salesInRange.reduce((s, x) => s + x.items.reduce((a, i) => a + (i.costPrice || 0) * i.qty, 0), 0);
  const expensesTotal = expensesInRange.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const revenue = ticketRevenue + salesRevenue;
  const cogs = ticketCOGS + salesCOGS;
  const grossProfit = revenue - cogs;
  const netProfit = grossProfit - expensesTotal;

  const labels = { day: "اليوم", week: "الأسبوع", month: "الشهر", all: "كل الفترة" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="segmented">
        {Object.keys(labels).map((k) => <button key={k} style={{ ...styles.navBtn, ...(period === k ? styles.navBtnActive : {}) }} onClick={() => setPeriod(k)}>{labels[k]}</button>)}
      </div>
      <div style={styles.statsRow}>
        <StatCard styles={styles} label={`إيرادات ${labels[period]}`} value={money(revenue)} accent="#3B93E0" />
        <StatCard styles={styles} label="تكلفة القطع (COGS)" value={money(cogs)} accent="#E0A030" />
        <StatCard styles={styles} label="المصروفات" value={money(expensesTotal)} accent="#E5484D" />
        <StatCard styles={styles} label="صافي الربح الحقيقي" value={money(netProfit)} accent={netProfit >= 0 ? "#33C15A" : "#E5484D"} />
      </div>
      <div style={styles.reportCard}>
        <div style={styles.reportTitle}>تفاصيل الفترة</div>
        <Row2 styles={styles} label="عدد إيصالات الصيانة المُسلَّمة" value={closedInRange.length} />
        <Row2 styles={styles} label="إيرادات الصيانة" value={money(ticketRevenue)} />
        <Row2 styles={styles} label="عدد عمليات البيع المباشر" value={salesInRange.length} />
        <Row2 styles={styles} label="إيرادات البيع المباشر" value={money(salesRevenue)} />
        <Row2 styles={styles} label="مجمل الربح (قبل المصروفات)" value={money(grossProfit)} />
        <Row2 styles={styles} label="المصروفات في الفترة" value={money(expensesTotal)} />
        <div style={{ ...styles.dim, marginTop: 10, fontSize: 11.5 }}>* دلوقتي صافي الربح بيخصم تكلفة القطع + المصروفات المسجلة يدويًا (إيجار، كهرباء، رواتب...) من الإيرادات. ده حساب مبسط لمتابعة الأداء، مش بديل عن محاسب حقيقي أو دفاتر قيد مزدوج رسمية.</div>
      </div>
    </div>
  );
}
function Row2({ styles, label, value }) { return <div style={styles.techRow}><span>{label}</span><span style={{ fontWeight: 700 }}>{value}</span></div>; }

function UsersManagement({ styles, technicians, notify }) {
  const [form, setForm] = useState({ name: "", email: "", password: "" });
  const [busy, setBusy] = useState(false);

  const addUser = async (e) => {
    e.preventDefault(); setBusy(true);
    try {
      const secAuth = getSecondaryAuth();
      const cred = await secAuth.createUserWithEmailAndPassword(form.email.trim(), form.password);
      await db.collection("technicians").doc(cred.user.uid).set({ name: form.name.trim(), email: form.email.trim(), role: "staff", active: true });
      await secAuth.signOut();
      notify("اتضاف الفني بنجاح");
      setForm({ name: "", email: "", password: "" });
    } catch (err) {
      const map = { "auth/email-already-in-use": "الإيميل ده مستخدم قبل كده", "auth/weak-password": "الباسورد لازم يكون 6 حروف على الأقل" };
      notify(map[err.code] || "حصل خطأ", "error");
    }
    setBusy(false);
  };

  const toggleActive = async (t) => await db.collection("technicians").doc(t.id).update({ active: !t.active });
  const toggleRole = async (t) => await db.collection("technicians").doc(t.id).update({ role: t.role === "admin" ? "staff" : "admin" });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <form onSubmit={addUser} style={styles.formCard}>
        <div style={styles.formTitle}>إضافة فني جديد</div>
        <div style={styles.formGrid}>
          <Field styles={styles} label="الاسم *"><input style={styles.input} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required /></Field>
          <Field styles={styles} label="الإيميل *"><input type="email" style={styles.input} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} required /></Field>
          <Field styles={styles} label="الباسورد *"><input type="text" style={styles.input} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} required minLength={6} /></Field>
        </div>
        <div style={styles.formActions}><button type="submit" style={styles.primaryBtn} disabled={busy}>{busy ? "جاري الإضافة..." : "إضافة"}</button></div>
      </form>
      <div style={styles.tableWrap}>
        {technicians.map((t) => (
          <div key={t.id} style={styles.ticketRow}>
            <div style={styles.rowTop}>
              <div style={styles.rowLeft}>
                <span style={{ ...styles.ledDot, background: t.active === false ? "#E5484D" : "#33C15A" }} />
                <span style={styles.customerName}>{t.name}</span>
                <span style={styles.tagPillMono}>{t.role === "admin" ? "أدمن" : "فني"}</span>
              </div>
              <div style={styles.rowActions}>
                <button style={styles.ghostBtnSm} onClick={() => toggleRole(t)}>{t.role === "admin" ? "خليه فني" : "خليه أدمن"}</button>
                <button style={styles.ghostBtnSm} onClick={() => toggleActive(t)}>{t.active === false ? "تفعيل" : "إيقاف"}</button>
              </div>
            </div>
            <div style={styles.dim}>{t.email}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
